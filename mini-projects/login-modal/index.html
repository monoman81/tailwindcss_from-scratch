<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Login Modal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&family=Rokkitt:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                fontFamily: {
                    sans: ['Mulish', 'sans-serif'],
                    mono: ['Rokkitt', 'monospace']
                }
            }
        }
    </script>
</head>
<body>
    <div class="flex items-center justify-center min-h-screen bg-rose-50">
        <div class="relative flex flex-col md:flex-row m-6 gap-10 md:gap bg-white shadow-2xl rounded-2xl">
            <div class="p-6 md:p-20">
                <h2 class="font-mono mb-5 text-4xl font-bold">Log In</h2>
                <p class="max-w-sm mb-12 font-sans font-light text-gray-600">
                    Log in to your account to upload or download pictures, videos or music.
                </p>
                <input type="text" placeholder="Enter your email address"
                       class="w-full p-6 border border-gray-300 rounded-medium placeholder:font-sans placeholder:font-light">
                <div class="flex flex-col items-center justify-between mt-6 gap-6 md:flex-row md:gap-0">
                    <div class="font-thin text-cyan-700">Forgot password</div>
                    <button class="w-full md:w-auto flex justify-center items-center py-6 px-9 gap-4 font-sans font-bold text-white
                        rounded-md shadow-sm md:shadow-lg shadow-cyan-100 bg-cyan-700 transition-all duration-150 hover:bg-opacity-90
                        border hover:-translate-y-0.5">
                        <span>Next</span>
                        <svg
                                xmlns="http://www.w3.org/2000/svg"
                                class="w-7"
                                viewBox="0 0 24 24"
                                stroke-width="1.5"
                                stroke="#ffffff"
                                fill="none"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                        >
                            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                            <line x1="5" y1="12" x2="19" y2="12" />
                            <line x1="13" y1="18" x2="19" y2="12" />
                            <line x1="13" y1="6" x2="19" y2="12" />
                        </svg>
                    </button>
                </div>
                <div class="mt-12 border-b border-b-gray-300"></div>
                <p class="py-6 text-sm font-thin text-center text-gray-400">or log in with</p>
                <div class="flex flex-col gap-6 md:flex-row md:gap-4">
                    <button class="flex items-center justify-center py-2 gap-3 border border-gray-300 rounded
                        shadow-sm transition-all hover:bg-opacity-30 hover:shadow-lg hover:-translate-y-0.5
                        duration-150 md:w-1/2"
                    >
                        <img src="images/facebook.png" alt="facebook" class="w-9">
                        <span class="font-thin">Facebook</span>
                    </button>
                    <button class="flex items-center justify-center py-2 gap-3 border border-gray-300 rounded
                        shadow-sm transition-all hover:bg-opacity-30 hover:shadow-lg hover:-translate-y-0.5
                        duration-150 md:w-1/2">
                        <img src="images/google.png" alt="facebook" class="w-9">
                        <span class="font-thin">Google</span>
                    </button>
                </div>
            </div>
            <img src="images/image.jpg" alt="" class="w-[430px] hidden md:block">
            <div class="group absolute -top-5 right-4 flex items-center justify-center w-10 h-10 bg-gray-200 rounded-full
                md:bg-white md:top-4 hover:cursor-pointer hover:-translate-y-0.5 transition duration-150"
            >
                <svg
                        xmlns="http://www.w3.org/2000/svg"
                        class="w-6 h-6 text-black group-hover:text-gray-600"
                        viewBox="0 0 24 24"
                        stroke-width="1.5"
                        stroke="currentColor"
                        fill="none"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                >
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <line x1="18" y1="6" x2="6" y2="18" />
                    <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
            </div>
        </div>
    </div>
</body>
</html>
