<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Product Modal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div class="flex justify-center items-center min-h-screen bg-slate-100">
        <div class="flex flex-col md:flex-row p-3 md:p-16 m-3 md-0 space-y-10 md:space-y-0 md:space-x-0 bg-white rounded-2xl shadow-2xl">
            <div class="overflow-hidden">
                <img src="images/headphone.png" alt="" class="mx-auto transition-all duration-200 hover:scale-105 w-60">
            </div>
            <div class="flex flex-col">
                <div class="flex flex-col gap-2 text-center md:text-left">
                    <div>
                        <span class="inline-block px-3 py-1 text-sm text-white bg-black rounded-full">Free Shipping</span>
                    </div>
<!--                    <span class="self-start px-3 py-1 text-sm text-white bg-black rounded-full">Free Shipping</span>-->
                    <div class="mt-0 max-w-sm text-2xl font-medium">
                        Razer Kraten Kitty Edt Gaming Headset Quartz
                    </div>
                    <div class="flex flex-col gap-3 text-center md:text-left">
                        <p class="line-through">$799</p>
                        <p class="text-5xl font-bold">$599</p>
                        <p class="text-sm font-light text-gray-400">
                            This offer is valid until April 3rd or as long as stock
                        </p>
                    </div>
                    <div class="group">
                        <button class="w-full bg-blue-700 text-white border-b-8 border-b-blue-700 rounded-lg transition-all
                            group-hover:border-t-8 group-hover:border-b-0 group-hover:bg-blue-700 group-hover:border-t-700
                            group-hover:shadow-lg"
                        >

                            <span class="block px-8 py-4 bg-blue-500 rounded-lg transition-all group-hover:bg-blue-700">
                                Add to cart
                            </span>

                        </button>
                    </div>
                    <div class="flex items-center space-x-3 group">
                        <div class="w-3 h-3 bg-green-400 rounded-full group-hover:animate-ping"></div>
                        <div class="text-sm">50+ pcs. in stock</div>
                    </div>
                    <div class="flex flex-col md:flex-row space-y-4 md:space-y-0 md:space-x-4">
                        <button class="flex items-center justify-center py-3 px-5 space-x-3 border-2 border-gray-300
                            transition-all duration-150 rounded-lg shadow-sm hover:bg-opacity-30 hover:shadow-lg hover:-translate-y-0.5"
                        >
                            <img src="images/weight.png" alt="weight" class="w-8">
                            <span>Add to cart</span>
                        </button>
                        <button class="flex items-center justify-center py-3 px-5 space-x-3 border-2 border-gray-300
                            transition-all duration-150 rounded-lg shadow-sm hover:bg-opacity-30 hover:shadow-lg hover:-translate-y-0.5"
                        >
                            <img src="images/heart.png" alt="weight" class="w-8">
                            <span>Add to wishlist</span>
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
