<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Pricing Cards</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div class="flex items-center gap-6 justify-center min-h-screen bg-slate-800">
        <div class="flex flex-col gap-6 md:flex-row">
            <div class="bg-slate-700 rounded-xl text-white">
                <div class="p-8 mx-3 mt-3 rounded-t-xl bg-slate-800">
                    <div class="text-center uppercase">Basic</div>
                    <h2 class="mt-10 font-serif text-5xl text-center">100GB</h2>
                    <h3 class="mt-2 text-center">$1.99/Month</h3>
                    <div class="flex justify-center items-center">
                        <a href=""
                           class="inline-block px-10 py-3 my-6 text-center border border-violet-600 rounded-lg
                           transition-all duration-500 hover:bg-violet-800 hover:border-violet-800">
                            Purchase
                        </a>
                    </div>
                </div>
                <div class="border-t border-slate-700"></div>
                <div class="p-8 mx-3 mb-3 rounded-b-xl bg-slate-800">
                    <div class="flex flex-col space-y-2">
                        <div class="flex justify-center items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
                                <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
                            </svg>
                            <span class="text-sm">100 GB of storage</span>
                        </div>
                        <div class="flex justify-center items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
                                <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
                            </svg>
                            <span class="text-sm">Option to add members</span>
                        </div>
                        <div class="flex justify-center items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
                                <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
                            </svg>
                            <span class="text-sm">Extra member benefits</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-violet-600 rounded-xl text-white md:scale-110">
                <div class="p-8 mx-3 mt-3 rounded-t-xl bg-slate-800">
                    <div class="text-center uppercase">Standard</div>
                    <h2 class="mt-10 font-serif text-5xl text-center">200GB</h2>
                    <h3 class="mt-2 text-center">$3.99/Month</h3>
                    <div class="flex justify-center items-center">
                        <a href=""
                           class="inline-block px-10 py-3 my-6 text-center border border-violet-600 rounded-lg
                           transition-all duration-500 bg-violet-600 hover:bg-violet-800 hover:border-violet-800">
                            Purchase
                        </a>
                    </div>
                </div>
                <div class="border-t border-slate-700"></div>
                <div class="p-8 mx-3 mb-3 rounded-b-xl bg-slate-800">
                    <div class="flex flex-col space-y-2">
                        <div class="flex justify-center items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
                                <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
                            </svg>
                            <span class="text-sm">200 GB of storage</span>
                        </div>
                        <div class="flex justify-center items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
                                <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
                            </svg>
                            <span class="text-sm">Option to add members</span>
                        </div>
                        <div class="flex justify-center items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
                                <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
                            </svg>
                            <span class="text-sm">Extra member benefits</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-slate-700 rounded-xl text-white">
                <div class="p-8 mx-3 mt-3 rounded-t-xl bg-slate-800">
                    <div class="text-center uppercase">Premium</div>
                    <h2 class="mt-10 font-serif text-5xl text-center">2TB</h2>
                    <h3 class="mt-2 text-center">$8.99/Month</h3>
                    <div class="flex justify-center items-center">
                        <a href=""
                           class="inline-block px-10 py-3 my-6 text-center border border-violet-600 rounded-lg
                           transition-all duration-500 hover:bg-violet-800 hover:border-violet-800">
                            Purchase
                        </a>
                    </div>
                </div>
                <div class="border-t border-slate-700"></div>
                <div class="p-8 mx-3 mb-3 rounded-b-xl bg-slate-800">
                    <div class="flex flex-col space-y-2">
                        <div class="flex justify-center items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
                                <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
                            </svg>
                            <span class="text-sm">2 TB of storage</span>
                        </div>
                        <div class="flex justify-center items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
                                <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
                            </svg>
                            <span class="text-sm">Option to add members</span>
                        </div>
                        <div class="flex justify-center items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
                                <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
                            </svg>
                            <span class="text-sm">Extra member benefits</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
